name: Build Windows and macOS

# Manual trigger: Actions tab -> "Build Windows and macOS" -> Run workflow.
# Compiles the restyled app and uploads an unsigned Windows .zip and an
# unsigned macOS .dmg as artifacts.

on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Enable long paths
        run: git config --system core.longpaths true

      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      # Required by the CMake install step (app/windows/CMakeLists.txt installs localsend_msix_helper.msix)
      - name: Build MSIX helper
        run: |
          $makepri = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.*\x64\makepri.exe' | Select-Object -Last 1
          & $makepri.FullName new /pr support\build\msix\content /cf support\build\msix\priconfig.xml /mn support\build\msix\content\AppxManifest.xml /of support\build\msix\content\resources.pri /o
          & 'C:\Program Files (x86)\Windows Kits\10\App Certification Kit\makeappx.exe' pack /o /d support\build\msix\content /nv /p app\windows\localsend_msix_helper.msix

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Compile for Windows
        working-directory: app
        run: flutter build windows --release

      - name: Create empty settings.json
        working-directory: app
        run: echo {} > build/windows/x64/runner/Release/settings.json

      - name: Add runtime DLL files
        working-directory: app
        run: |
          Copy-Item ../support/build/windows/x64/msvcp140.dll build/windows/x64/runner/Release/
          Copy-Item ../support/build/windows/x64/vcruntime140.dll build/windows/x64/runner/Release/
          Copy-Item ../support/build/windows/x64/vcruntime140_1.dll build/windows/x64/runner/Release/

      - name: Remove MSIX helper from portable bundle
        working-directory: app
        run: |
          Remove-Item build/windows/x64/runner/Release/localsend_msix_helper.msix -ErrorAction SilentlyContinue
          Remove-Item build/windows/x64/runner/Release/install_msix_helper.ps1 -ErrorAction SilentlyContinue
          Remove-Item build/windows/x64/runner/Release/localsend_app.exe.manifest -ErrorAction SilentlyContinue

      - name: Zip compiled files
        working-directory: app
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "LocalSend-custom-windows-x64.zip"

      - uses: actions/upload-artifact@v6
        with:
          name: windows-zip
          path: app/LocalSend-custom-windows-x64.zip
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      # The project is tied to the original author's Apple developer team, which
      # does not exist on this runner. Switch to ad-hoc signing and drop the
      # restricted app-group entitlement (it needs a provisioning profile).
      - name: Disable code signing
        working-directory: app/macos
        run: |
          sed -i '' \
            -e 's/CODE_SIGN_IDENTITY = "Apple Development";/CODE_SIGN_IDENTITY = "-";/' \
            -e 's/"CODE_SIGN_IDENTITY\[sdk=macosx\*\]" = "Apple Development";/"CODE_SIGN_IDENTITY[sdk=macosx*]" = "-";/' \
            -e 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/' \
            -e 's/DEVELOPMENT_TEAM = [A-Z0-9]*;/DEVELOPMENT_TEAM = "";/' \
            Runner.xcodeproj/project.pbxproj
          python3 - <<'PY'
          import re
          for f in ["Runner/Release.entitlements", "Runner/DebugProfile.entitlements", "ShareExtension/ShareExtension.entitlements"]:
              s = open(f).read()
              s = re.sub(r"\s*<key>com\.apple\.security\.application-groups</key>\s*<array>.*?</array>", "", s, flags=re.S)
              open(f, "w").write(s)
          PY

      - name: Compile for macOS
        working-directory: app
        run: flutter build macos --release

      - name: Create dmg (unsigned)
        working-directory: app
        run: |
          mkdir dmg-root
          cp -R build/macos/Build/Products/Release/LocalSend.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "LocalSend" \
            -srcfolder dmg-root \
            -ov -format UDZO LocalSend-custom-macos.dmg

      - uses: actions/upload-artifact@v6
        with:
          name: macos-dmg
          path: app/LocalSend-custom-macos.dmg
          if-no-files-found: error
